[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trellis-mcp"
version = "0.1.0"
description = "Trellis: MCP servers, prompt renderer and hooks for the Sunny/Iris/Ben agent workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abu Shadab" }]
dependencies = [
    "fastmcp>=3.4,<4",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
trellis = "trellis_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["trellis_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
