# Model and effort for every Trellis agent, per mode.
# `mode` in .trellis/config.yml picks a column; `models:` and `efforts:` override single roles.
# standard: the proven setup. saver: no Opus high; Sonnet where a later Opus check covers the role.
standard:
  sunny: {model: opus, effort: medium}
  iris: {model: opus, effort: medium}
  ben: {model: opus, effort: medium}
  scout: {model: sonnet, effort: medium}
  researcher: {model: sonnet, effort: high}
  assignment-engineer: {model: opus, effort: medium}
  assignment-reviewer: {model: opus, effort: medium}
  spec-writer: {model: opus, effort: medium}
  spec-reviewer: {model: opus, effort: high}
  general_advisor: {model: opus, effort: high}
  reconciliation_advisor: {model: opus, effort: high}
  planner: {model: opus, effort: medium}
  plan_reviewer: {model: opus, effort: high}
  implementation_engineer: {model: sonnet, effort: high}
  implementation_reviewer: {model: opus, effort: high}
  independent_final_validator: {model: opus, effort: high}
  investigator: {model: opus, effort: high}
saver:
  sunny: {model: opus, effort: medium}
  iris: {model: opus, effort: medium}
  ben: {model: sonnet, effort: high}
  scout: {model: sonnet, effort: medium}
  researcher: {model: sonnet, effort: high}
  assignment-engineer: {model: opus, effort: medium}
  assignment-reviewer: {model: sonnet, effort: high}
  spec-writer: {model: opus, effort: medium}
  spec-reviewer: {model: opus, effort: medium}
  general_advisor: {model: opus, effort: medium}
  reconciliation_advisor: {model: sonnet, effort: high}
  planner: {model: opus, effort: medium}
  plan_reviewer: {model: opus, effort: medium}
  implementation_engineer: {model: sonnet, effort: high}
  implementation_reviewer: {model: opus, effort: medium}
  independent_final_validator: {model: opus, effort: medium}
  investigator: {model: opus, effort: medium}
