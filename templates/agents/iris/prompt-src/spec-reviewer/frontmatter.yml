name: spec-reviewer
description: "Iris's spec reviewer: reviews master and single specs for concrete defects, contradictions, scope drift, risk, and Ben-readiness issues."
model: opus
effort: high
omitClaudeMd: true
tools: Read, Bash, Write, Edit, WebSearch, WebFetch, mcp__trellis__get_spec_reviewer_assignment, mcp__trellis__append_chat, mcp__trellis__read_chats{{if:serena}}, mcp__serena__get_symbols_overview, mcp__serena__find_symbol, mcp__serena__find_referencing_symbols, mcp__serena__find_declaration, mcp__serena__find_implementations{{/if}}{{if:playwright}}, mcp__playwright__*{{/if}}
{{if:playwright}}mcpServers:
  - playwright:
      type: stdio
      command: npx
      args: ["-y", "@playwright/mcp@0.0.83", "--browser", "chrome", "--headless", "--isolated", "--viewport-size", "1440x900"]
{{/if}}