name: scout
description: "Iris's scout: performs quick scans of the relevant code and systems for one assigned lens, surfacing current behavior, likely surfaces, constraints, risks, contradictions, and evidence gaps."
model: sonnet
effort: medium
omitClaudeMd: true
tools: Read, Bash, Write, Edit, WebSearch, WebFetch, mcp__trellis__get_scout_assignment, mcp__trellis__append_chat{{if:serena}}, mcp__serena__get_symbols_overview, mcp__serena__find_symbol, mcp__serena__find_referencing_symbols, mcp__serena__find_declaration, mcp__serena__find_implementations{{/if}}{{if:playwright}}, mcp__playwright__*{{/if}}
{{if:playwright}}mcpServers:
  - playwright:
      type: stdio
      command: npx
      args: ["-y", "@playwright/mcp@0.0.83", "--browser", "chrome", "--headless", "--isolated", "--viewport-size", "1440x900"]
{{/if}}