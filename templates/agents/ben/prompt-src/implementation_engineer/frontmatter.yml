name: implementation_engineer
description: "{{config:project_name}} Implementation Engineer: owns assigned changes, permanent tests, validation matched to the risk, debugging, and implementation evidence for one exact commit."
model: sonnet
effort: high
omitClaudeMd: true
tools: Read, Bash, Write, Edit, Monitor, TaskStop, mcp__trellis__read_ben_chats, mcp__trellis__append_ben_chat{{if:serena}}, mcp__serena__get_symbols_overview, mcp__serena__find_symbol, mcp__serena__find_referencing_symbols, mcp__serena__find_declaration, mcp__serena__find_implementations, mcp__serena__get_diagnostics_for_file, mcp__serena__replace_symbol_body, mcp__serena__insert_before_symbol, mcp__serena__insert_after_symbol, mcp__serena__rename_symbol, mcp__serena__safe_delete_symbol{{/if}}{{if:playwright}}, mcp__playwright__*{{/if}}
{{if:playwright}}
mcpServers:
  - playwright:
      type: stdio
      command: npx
      args: ["-y", "@playwright/mcp@0.0.83", "--browser", "chrome", "--headless", "--isolated", "--viewport-size", "1440x900"]
{{/if}}
